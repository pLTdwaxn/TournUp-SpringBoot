name: Build and Publish

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.VULTR_CR_REGISTRY }}/tournup

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21.0.13+9"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic

      - name: Run tests
        run: ./gradlew test

  build-image:
    name: Build Docker image
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/'))
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image and archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          tags: tournup:build
          outputs: type=docker,dest=/tmp/tournup.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Store image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tournup-image
          path: /tmp/tournup.tar
          compression-level: 0
          retention-days: 30

  publish-master:
    name: Publish preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-image
    runs-on: ubuntu-latest

    steps:
      - name: Download image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tournup-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/tournup.tar

      - name: Log in to Vultr CR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ vars.VULTR_CR_REGISTRY }}
          username: ${{ secrets.VULTR_CR_USERNAME }}
          password: ${{ secrets.VULTR_CR_API_KEY }}

      - name: Publish preview image
        run: |
          docker tag tournup:build "$IMAGE:preview"
          docker tag tournup:build "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:preview"
          docker push "$IMAGE:sha-$GITHUB_SHA"

  publish-tag:
    name: Publish PRODUCTION
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-image
    runs-on: ubuntu-latest
    environment: production-publish

    steps:
      - name: Download image
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: tournup-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/tournup.tar

      - name: Log in to Vultr CR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ vars.VULTR_CR_REGISTRY }}
          username: ${{ secrets.VULTR_CR_USERNAME }}
          password: ${{ secrets.VULTR_CR_API_KEY }}

      - name: Publish tagged image
        run: |
          docker tag tournup:build "$IMAGE:$GITHUB_REF_NAME"
          docker tag tournup:build "$IMAGE:sha-$GITHUB_SHA"
          docker tag tournup:build "$IMAGE:production"
          docker push "$IMAGE:$GITHUB_REF_NAME"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:production"
