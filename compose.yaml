services:
  postgresql:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tournup_preview}
      POSTGRES_USER: ${DB_USER:-tournup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tournup:
    image: ${TOURNUP_IMAGE:-tournup:preview}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: preview
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tournup_preview}
      DB_USER: ${DB_USER:-tournup}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TOURNUP_AUTH_PROVIDER: stub
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    ports:
      - "127.0.0.1:${TOURNUP_PORT:-8080}:8080"

volumes:
  postgresql_data:
      