$kind: http-request
name: Tenant Database
method: GET
url: "{{baseUrl}}/api/dev/database/"
headers:
  - key: Cookie
    value: "{{sessionCookie}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |
      pm.test("Uses the selected tenant database and role", function () {
        pm.response.to.have.status(200);
        const result = pm.response.json();

        pm.expect(result.database)
          .to.eql(pm.iterationData.get("expectedDatabase"));
        pm.expect(result.user)
          .to.eql(pm.iterationData.get("expectedDbUser"));
      });

      pm.test("Returns the expected tenant tournament", function () {
        const result = pm.response.json();

        pm.expect(result.tournamentId)
          .to.eql(pm.iterationData.get("expectedTournamentId"));

        pm.expect(result.tournamentName)
          .to.eql(pm.iterationData.get("expectedTournamentName"));
      });
