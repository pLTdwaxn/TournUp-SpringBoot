$kind: http-request
id: f542a3f0fb77581c77192d3c
name: Login
method: POST
url: '{{baseUrl}}/api/auth/login/'
body:
  type: json
  content: '{"credentials":{"accessLevel":"PLAYER"}}'
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-TOKEN
    value: '{{csrfToken}}'
  - key: Cookie
    value: '{{sessionCookie}}'
scripts:
  - type: afterResponse
    code: |-

      pm.test("HTTP status is 200", function () {
        pm.response.to.have.status(200);
      });
      const user = pm.response.json();
      pm.test("Logged in as a player", function () {
        pm.expect(user.authorities).to.include("ROLE_PLAYER");
      });
      pm.variables.set("loggedInUserId", user.userId);
      const cookie = pm.response.headers.get("Set-Cookie");
      if (cookie) {
        pm.variables.set("sessionCookie", cookie.split(";")[0]);
      }
    language: text/javascript
