$kind: http-request
method: GET
url: "{{baseUrl}}/api/health/"
scripts:
  - type: afterResponse
    code: |
      
      pm.test("HTTP status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("API is healthy", function () {
        pm.expect(pm.response.json().status).to.eql("healthy");
      });
    language: text/javascript
