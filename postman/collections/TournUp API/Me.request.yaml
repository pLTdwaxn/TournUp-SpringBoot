$kind: http-request
id: 0fe727bdeb648cafd4d5e563
name: Me
method: GET
url: '{{baseUrl}}/api/auth/me/'
headers:
  - key: Cookie
    value: '{{sessionCookie}}'
scripts:
  - type: afterResponse
    code: |-

      pm.test("HTTP status is 200", function () {
        pm.response.to.have.status(200);
      });
      pm.test("Session belongs to the logged-in user", function () {
        pm.expect(pm.response.json().userId).to.eql(pm.variables.get("loggedInUserId"));
      });
      pm.test("Session has the player role", function () {
        pm.expect(pm.response.json().authorities).to.include("ROLE_PLAYER");
      });
    language: text/javascript
