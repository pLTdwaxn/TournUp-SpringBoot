$kind: http-request
method: GET
url: "{{baseUrl}}/api/auth/csrf/"
scripts:
  - type: afterResponse
    code: |
      const responseCookie = pm.response.headers.all()
        .filter(h => h.key.toLowerCase() === "set-cookie")
        .map(h => h.value.split(";")[0])
        .find(cookie => cookie.startsWith("JSESSIONID="));

      const existingSessionId = pm.cookies.get("JSESSIONID");
      const sessionCookie = responseCookie ||
        (existingSessionId ? `JSESSIONID=${existingSessionId}` : null);

      pm.test("Session cookie is available", function () {
        pm.expect(sessionCookie).to.be.a("string").and.not.empty;
      });

      if (sessionCookie) {
        pm.variables.set("sessionCookie", sessionCookie);
      } else {
        pm.variables.unset("sessionCookie");
      }

      pm.test("HTTP status is 200", function () {
        pm.response.to.have.status(200);
      });
      const csrf = pm.response.json();
      pm.test("CSRF token and header are present", function () {
        pm.expect(csrf.token).to.be.a("string").and.not.empty;
        pm.expect(csrf.headerName).to.be.a("string").and.not.empty;
      });
      pm.variables.set("csrfToken", csrf.token);
      pm.variables.set("csrfHeaderName", csrf.headerName);
    language: text/javascript
