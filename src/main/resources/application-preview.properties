# Hibernate startup database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
tournup.bootstrap.datasource.credential-reference=${DB_CREDENTIAL_REFERENCE}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Migrations run separately from preview runtime
spring.flyway.enabled=false
tournup.catalog.migration.enabled=false

# Database credential provider
tournup.credentials.provider=openbao
tournup.credentials.openbao.address=${OPENBAO_ADDR}
tournup.credentials.openbao.ca-certificate=/run/openbao/trust/ca.crt
tournup.credentials.openbao.token-file=/run/openbao/token/token

# Catalog runtime reader
tournup.catalog.datasource.url=jdbc:postgresql://${CATALOG_DB_HOST}:${CATALOG_DB_PORT:5432}/${CATALOG_DB_NAME}
tournup.catalog.datasource.username=${CATALOG_DB_USER}
tournup.catalog.datasource.credential-reference=${CATALOG_DB_CREDENTIAL_REFERENCE}

tournup.auth.provider=${TOURNUP_AUTH_PROVIDER}

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
