spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:abeesmall_tournup}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

tournup.auth.provider=${TOURNUP_AUTH_PROVIDER}

# Catalog database: runtime reader
tournup.catalog.datasource.url=jdbc:postgresql://${CATALOG_DB_HOST}:${CATALOG_DB_PORT}/${CATALOG_DB_NAME}
tournup.catalog.datasource.username=${CATALOG_DB_USER}
tournup.catalog.datasource.password=${CATALOG_DB_PASSWORD}

# Catalog database: local migrations
tournup.catalog.migration.username=${DB_USER}
tournup.catalog.migration.password=${DB_PASSWORD}
